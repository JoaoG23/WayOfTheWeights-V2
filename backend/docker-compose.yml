# Backend em container. O banco de dados NÃO sobe aqui: aponte DATABASE_URL
# (no arquivo .env.prod) para o banco de testes do servidor.
#
# Formato 3.7: funciona no docker-compose v1 e no "docker compose" v2.
# Para subir, use o deploy.sh (ele roda as migrations antes da API).
#
# Variáveis de ambiente do próprio compose (todas opcionais):
#   IMAGEM_BACKEND    nome da imagem, ex.: registro.exemplo.com/wow/backend
#   TAG_IMAGEM        tag da imagem, ex.: o SHA do commit (padrão: latest)
#   COMMIT_SHA        gravado no label da imagem
#   PORTA             porta da API, dentro do container e no servidor (padrão: 3001)
#   UPLOADS_HOST_DIR  pasta do servidor onde ficam as fotos (padrão: ./uploads)
version: "3.7"

x-ambiente: &ambiente
  env_file: .env.prod
  # Banco instalado no próprio servidor: use host.docker.internal na
  # DATABASE_URL para alcançá-lo de dentro do container (Docker 20.10+).
  # Se o seu Docker for mais antigo, use o IP do servidor na DATABASE_URL.
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # Aplica as migrations e termina. Não é dependência da API de propósito: o
  # deploy.sh roda "run --rm migrar" ANTES de subir a API (o formato 3.7 não
  # sabe esperar um serviço terminar).
  migrar:
    <<: *ambiente
    image: ${IMAGEM_BACKEND:-wayoftheweights-backend}-migracao:${TAG_IMAGEM:-latest}
    build:
      context: .
      target: migracao
    restart: "no"

  backend:
    <<: *ambiente
    image: ${IMAGEM_BACKEND:-wayoftheweights-backend}:${TAG_IMAGEM:-latest}
    build:
      context: .
      target: runtime
      args:
        COMMIT_SHA: ${COMMIT_SHA:-desconhecido}
    environment:
      PORT: "${PORTA:-3001}"
      UPLOADS_DIR: /app/uploads
    ports:
      - "${PORTA:-3001}:${PORTA:-3001}"
    volumes:
      # Fotos de perfil no disco do servidor. O container roda como o usuário
      # "node" (uid 1000): a pasta precisa ser gravável por ele
      # (chown -R 1000:1000 <pasta>).
      - ${UPLOADS_HOST_DIR:-./uploads}:/app/uploads
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Endurecimento: sistema de arquivos somente leitura (só /tmp e o volume
    # de uploads são graváveis), sem privilégios extras.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
